# Local-dev-only secrets (Cloudinary/Resend keys) live in application-secrets.properties,
# which is gitignored and never bundled into the jar/Docker image. In production those same
# properties come from real environment variables via docker-compose's .env instead, so this
# import is silently skipped there.
spring.config.import=optional:file:./application-secrets.properties,optional:file:./backend/application-secrets.properties

spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/collzap_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# This is a REST API, not a server-rendered view — nothing ever needs a lazy
# association resolved during view rendering. Left at Spring Boot's default
# (true), every request holds its DB connection open for the full request
# instead of releasing it once the transaction commits, which starves the
# (small, Supabase-pooler-backed) Hikari pool under load far sooner than the
# query load alone would.
spring.jpa.open-in-view=false
# Sized for Supabase's session pooler (see .env.example) and the 500MB prod
# container, not Hikari's 10-connection default — too small for Tomcat's
# ~200 request threads once any request holds a connection slightly longer
# than usual (e.g. a slow email/webhook call in the same transaction).
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
collzap.jwt.secret=${JWT_SECRET}
collzap.jwt.issuer=collzap
collzap.jwt.access-token-ttl=2h
collzap.jwt.refresh-token-ttl=30d
server.port=8081
server.forward-headers-strategy=framework
collzap.mail.log-codes=${LOG_OTP_CODES:true}
collzap.seriousness-test.retake-lock-days=${RETAKE_LOCK_DAYS:0}
collzap.matching.unlock-points=${MATCHING_UNLOCK_POINTS:500}
collzap.admin.bootstrap-username=${ADMIN_BOOTSTRAP_USERNAME:admin}
collzap.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
collzap.admin.seed-demo-data=${SEED_DEMO_DATA:true}
collzap.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
collzap.cloudinary.api-key=${CLOUDINARY_API_KEY:}
collzap.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
collzap.mail.resend-api-key=${RESEND_API_KEY:}
collzap.mail.from-address=${MAIL_FROM_ADDRESS:otp@mail.collzap.com}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000

# --- Health probes -------------------------------------------------------------
# Spring's default /actuator/health runs a database validation query, so it has to
# wait for a Hikari connection like any other request. Under load that queue is the
# whole problem: the 45-minute soak test at 150 concurrent users saw it answer only
# 1.3% of the time, while the app itself was still serving requests fine. Docker's
# HEALTHCHECK was pointed at it, so a busy-but-working backend reports as unhealthy.
#
# /actuator/health/liveness answers "is this process up and serving HTTP" without
# touching the database, which is the only question a container healthcheck should
# ask; a database outage is not a reason to kill the app. /actuator/health/readiness
# keeps the database check, for load balancers and humans deciding whether to send
# traffic, and plain /actuator/health still reports everything.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
